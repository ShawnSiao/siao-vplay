[package]
name = "siao-vplay"
version = "0.1.0"
description = "Windows local-first cross-language intelligent video player"
authors = ["ShawnSiao"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "siao_vplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1.0.5"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
