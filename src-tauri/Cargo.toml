[package]
name = "siao-vplay"
version = "0.1.0"
description = "Windows local-first cross-language intelligent video player"
authors = ["ShawnSiao"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "siao_vplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
