[package]
name = "siao-vplay"
version = "0.2.0"
description = "Windows local-first cross-language intelligent video player"
authors = ["ShawnSiao"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "siao_vplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Only the explicitly named bridge candidate may use the legacy product-local
# runtime search. The default build always initializes the shared Store.
bridge = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
siao-component-store-core = { git = "https://github.com/ShawnSiao/siao-component-store.git", rev = "8d41b55" }
siao-component-store-catalogs = { git = "https://github.com/ShawnSiao/siao-component-store.git", rev = "8d41b55" }
dunce = "1.0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
regex = "1.11"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
thiserror = "2.0.19"
url = "2.5.7"
uuid = { version = "1.24.0", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"
