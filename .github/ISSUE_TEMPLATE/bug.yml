name: Bug 报告
description: 报告可复现的问题（不要上传个人媒体或凭据）
body:
  - type: input
    id: version
    attributes:
      label: 应用版本与 Windows 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用匿名文件名；不要填写真实媒体路径、字幕正文或密钥。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏诊断
      description: 可提供错误码与截图。安全漏洞请通过 SECURITY.md 的私密渠道报告。
