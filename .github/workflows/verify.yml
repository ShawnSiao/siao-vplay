name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tmp/cargo-target
      # Avoid the runner account's 8.3 TEMP alias: fixtures compare their paths
      # with canonical paths returned by storage/resource operations.
      TEMP: ${{ runner.temp }}/siaovplay-tests
      TMP: ${{ runner.temp }}/siaovplay-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare isolated test temporary directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - run: npm run check:release
      - run: npm run test:tools
      - run: npm run contracts:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:size
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run notices:check
      - name: Verify public tree and app-only payload
        shell: pwsh
        run: |
          $private = git ls-files -- AGENTS.md docs local-docs designs local-tools planning requirements roadmap
          if ($private) { throw "Private files are tracked" }
          ./tools/check-app-only-package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure
          path: |
            test-results
            playwright-report
          retention-days: 7
