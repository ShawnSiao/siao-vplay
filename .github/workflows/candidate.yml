name: Build local candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tmp/cargo-target
      SIAOVPLAY_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - run: npm run check:release
      - run: npm run test:tools
      - run: cargo test --locked --release --lib --manifest-path src-tauri/Cargo.toml ipc_contracts
      - run: npm run contracts:check
      - run: npm run desktop:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-candidate
          path: artifacts
          retention-days: 14
# No release token, publication, signing credentials, or self-hosted runners.
